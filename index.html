<!DOCTYPE html>
<!-- 每次改版可換 data-build（裝了 sw.js 後其實不改也會自動更新；此值供版本標籤／備援用） -->
<html lang="zh-Hant" data-build="2025-08-25-1">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2B2522">
<title>白光叫貨 · 進貨總台</title>
<style>
  :root{
    --paper:#F3EEE6; --surface:#FFFFFF; --surface-2:#FBF8F3;
    --ink:#2B2522; --muted:#8A7F76; --line:#E7DECF; --line-soft:#F0E9DD;
    --amber:#C8862B; --amber-ink:#8A5A14;
    --st-pending:#C0392B; --st-pending-bg:#FBEAE7;
    --st-ordered:#2E8B57; --st-ordered-bg:#E7F3EC;
    --st-arrived:#8A8F94; --st-arrived-bg:#EFEFEF;
    --radius:14px; --shadow:0 1px 2px rgba(43,37,34,.06), 0 6px 18px rgba(43,37,34,.06);
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--sans); color:var(--ink); background:var(--paper);
    font-size:16px; line-height:1.45; padding-bottom:120px;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}

  /* ---------- Header ---------- */
  .topbar{position:sticky;top:0;z-index:40;background:var(--ink);color:#F3EEE6;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px}
  .brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:baseline;gap:8px;font-weight:700;letter-spacing:.04em}
  .brand .beam{font-size:13px;font-weight:600;color:#E6C892;letter-spacing:.18em}
  .brand small{font-weight:500;color:#B9AEA3;font-size:12px;letter-spacing:.06em}
  .me-pick{display:flex;align-items:center;gap:6px;font-size:13px;color:#CFC4B8}
  .me-pick select{
    background:#3A332E;border:1px solid #4A423B;color:#F3EEE6;border-radius:999px;
    padding:7px 10px;font-size:13px;font-weight:600;min-height:36px}
  .seg{display:flex;background:#3A332E;border-radius:999px;padding:3px;margin-top:12px;gap:3px}
  .seg button{flex:1;border-radius:999px;padding:9px 4px;font-size:14px;font-weight:600;
    color:#CFC4B8;min-height:40px;transition:.15s;white-space:nowrap}
  .seg button.on{background:#F3EEE6;color:#2B2522}
  .seg.n3 button{font-size:13.5px;letter-spacing:-.01em}
  @media (max-width:360px){ .seg.n3 button{font-size:12.5px;padding:9px 2px} }

  /* ---------- Tabs ---------- */
  .tabs{position:sticky;top:0;z-index:30;display:flex;background:var(--surface);
    border-bottom:1px solid var(--line)}
  .tabs button{flex:1;padding:14px 8px;font-size:15px;font-weight:600;color:var(--muted);
    position:relative;min-height:50px}
  .tabs button.on{color:var(--ink)}
  .tabs button.on::after{content:"";position:absolute;left:50%;transform:translateX(-50%);
    bottom:0;width:36px;height:3px;border-radius:3px 3px 0 0;background:var(--amber)}
  .tabs .count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;
    height:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--st-pending);
    color:#fff;font-size:12px;font-weight:700;font-family:var(--mono)}
  .tabs .count.zero{background:var(--line);color:var(--muted)}

  .wrap{max-width:560px;margin:0 auto;padding:14px 14px 0}

  /* ---------- Search ---------- */
  .searchbar{position:sticky;top:50px;z-index:20;background:var(--paper);
    padding:12px 14px;margin:0 -14px 4px;border-bottom:1px solid var(--line-soft)}
  .search-in{display:flex;align-items:center;gap:8px;background:var(--surface);
    border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:46px;box-shadow:var(--shadow)}
  .search-in svg{flex:0 0 18px;color:var(--muted)}
  .search-in input{flex:1;border:none;outline:none;background:none;font-size:16px;padding:12px 0}
  .search-in .clr{color:var(--muted);font-size:20px;padding:6px;line-height:1}

  /* ---------- Catalog ---------- */
  .vendor{margin:18px 0 8px;display:flex;align-items:center;gap:10px}
  .vendor h3{margin:0;font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--amber-ink);
    text-transform:uppercase;white-space:nowrap}
  .vendor .rule{flex:1;height:1px;background:var(--line)}
  .vendor .n{font-size:12px;color:var(--muted);font-family:var(--mono)}

  .item{display:flex;align-items:center;gap:12px;background:var(--surface);
    border:1px solid var(--line-soft);border-radius:12px;padding:12px 12px;margin-bottom:8px;
    box-shadow:var(--shadow)}
  .item .meta{flex:1;min-width:0}
  .item .nm{font-weight:600;font-size:16px;line-height:1.3}
  .item .unit{font-size:12px;color:var(--muted);font-weight:500;margin-top:3px}
  .item .add{flex:0 0 auto;border:1.5px solid var(--amber);color:var(--amber-ink);
    background:#fff;border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;min-height:42px}
  .item .add.in{background:var(--amber);color:#fff;border-color:var(--amber)}

  .empty{text-align:center;color:var(--muted);padding:48px 20px}
  .empty .big{font-size:17px;font-weight:600;color:var(--ink);margin-bottom:6px}
  .empty .manual{margin-top:16px}

  /* ---------- Cart bar ---------- */
  .cartbar{position:fixed;left:0;right:0;bottom:0;z-index:50;
    padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);
    background:linear-gradient(to top,var(--paper) 70%,transparent);pointer-events:none}
  .cartbar .inner{max-width:560px;margin:0 auto;pointer-events:auto;
    background:var(--ink);color:#F3EEE6;border-radius:14px;padding:12px 14px;
    display:flex;align-items:center;gap:12px;box-shadow:0 8px 30px rgba(43,37,34,.28);
    transform:translateY(140%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
  .cartbar.show .inner{transform:translateY(0)}
  .cartbar .summary{flex:1;font-size:14px}
  .cartbar .summary b{font-size:16px}
  .cartbar .view{background:#F3EEE6;color:#2B2522;border-radius:999px;padding:10px 18px;
    font-weight:700;min-height:44px}

  /* ---------- Bottom sheet (cart) ---------- */
  .sheet-mask{position:fixed;inset:0;z-index:60;background:rgba(43,37,34,.45);
    opacity:0;visibility:hidden;transition:.2s}
  .sheet-mask.open{opacity:1;visibility:visible}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--paper);
    border-radius:20px 20px 0 0;max-width:560px;margin:0 auto;max-height:86vh;overflow:auto;
    transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);
    padding:8px 16px calc(env(safe-area-inset-bottom) + 16px)}
  .sheet.open{transform:translateY(0)}
  .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:8px auto 6px}
  .sheet h2{font-size:18px;margin:6px 2px 14px;display:flex;justify-content:space-between;align-items:center}
  .sheet h2 .clear{font-size:13px;color:var(--st-pending);font-weight:600}
  .crow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line-soft);
    border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .crow .nm{flex:1;font-weight:600}
  .crow .nm .v{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
  .crow .nm .u{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
  .qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .qty button{width:38px;height:40px;font-size:20px;color:var(--amber-ink);background:var(--surface-2)}
  .qty input{width:48px;height:40px;text-align:center;border:none;outline:none;background:#fff;
    font-size:16px;font-weight:600;font-family:var(--mono)}
  .crow .del{color:var(--muted);font-size:22px;padding:6px 4px;line-height:1}
  .submit{width:100%;background:var(--amber);color:#fff;font-weight:700;font-size:17px;
    border-radius:14px;padding:16px;margin-top:10px;min-height:54px;box-shadow:var(--shadow)}
  .submit:disabled{opacity:.5}

  /* manual add */
  .manual-form{background:var(--surface);border:1px dashed var(--line);border-radius:12px;
    padding:14px;margin-top:10px}
  .manual-form label{display:block;font-size:13px;color:var(--muted);margin:0 0 4px;font-weight:600}
  .manual-form input,.manual-form select{width:100%;border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;background:#fff;margin-bottom:10px;min-height:44px}
  .manual-form .row2{display:flex;gap:10px}
  .manual-form .row2>div{flex:1}

  /* ---------- Board ---------- */
  .filters{display:flex;gap:8px;overflow-x:auto;padding:12px 14px 6px;margin:0 -14px;
    -webkit-overflow-scrolling:touch}
  .filters::-webkit-scrollbar{display:none}
  .fchip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;
    padding:8px 14px;font-size:14px;font-weight:600;color:var(--muted);min-height:40px;white-space:nowrap}
  .fchip.on{background:var(--ink);color:#F3EEE6;border-color:var(--ink)}
  .board-tools{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 12px}
  .board-tools .upd{font-size:12px;color:var(--muted);font-family:var(--mono)}
  .refresh{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;
    color:var(--amber-ink);padding:8px 6px}
  .refresh.spin svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .grp-head{display:flex;align-items:center;gap:8px;margin:16px 2px 8px}
  .grp-head .dot{width:9px;height:9px;border-radius:50%}
  .grp-head h3{margin:0;font-size:14px;font-weight:700}
  .grp-head .gn{font-size:12px;color:var(--muted);font-family:var(--mono)}

  .card{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;
    padding:13px 14px;margin-bottom:9px;box-shadow:var(--shadow);border-left:4px solid var(--line)}
  .card.s-pending{border-left-color:var(--st-pending)}
  .card.s-ordered{border-left-color:var(--st-ordered)}
  .card.s-arrived{border-left-color:var(--st-arrived);opacity:.72}
  .card .top{display:flex;align-items:flex-start;gap:10px}
  .card .nm{flex:1;font-weight:700;font-size:16px}
  .card .nm .q{color:var(--amber-ink);font-family:var(--mono);font-weight:700;margin-left:6px;font-size:15px}
  .card .info{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:7px;font-size:12.5px;color:var(--muted)}
  .card .info .t{font-family:var(--mono)}
  .statetag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;letter-spacing:.05em;white-space:nowrap}
  .statetag.pending{color:var(--st-pending);background:var(--st-pending-bg)}
  .statetag.ordered{color:var(--st-ordered);background:var(--st-ordered-bg)}
  .statetag.arrived{color:var(--st-arrived);background:var(--st-arrived-bg)}
  .card .act{margin-top:11px;display:flex;gap:8px;align-items:center}
  .btn-act{flex:1;border-radius:10px;padding:11px;font-weight:700;font-size:14.5px;min-height:46px;
    border:1.5px solid transparent}
  .btn-order{background:var(--st-ordered);color:#fff}
  .btn-arrive{background:var(--ink);color:#F3EEE6}
  .eta-row{display:none;gap:8px;margin-top:9px}
  .eta-row.show{display:flex}
  .eta-row input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;background:#fff}
  .eta-row .go{background:var(--st-ordered);color:#fff;border-radius:10px;padding:0 16px;font-weight:700;min-height:44px}

  .skel{height:78px;border-radius:12px;margin-bottom:9px;
    background:linear-gradient(90deg,var(--surface-2) 25%,#fff 50%,var(--surface-2) 75%);
    background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}

  /* ---------- Board: 廠商分組卡 ---------- */
  .vcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden}
  .vhead{display:flex;align-items:center;gap:10px;padding:13px 14px 11px;background:var(--surface-2);
    border-bottom:1px solid var(--line-soft)}
  .vhead h3{margin:0;font-size:16px;font-weight:800;letter-spacing:.01em;flex:0 1 auto}
  .vhead .vcount{margin-left:auto;font-size:12px;color:var(--muted);font-family:var(--mono);white-space:nowrap}
  .vbody{padding:4px 8px}
  .irow{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:11px 6px;border-bottom:1px solid var(--line-soft)}
  .eta-inline{flex-basis:100%;display:flex;gap:6px;margin-top:2px}
  .eta-inline input{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-height:42px;background:#fff;font-size:15px}
  .eta-inline .ok{flex:0 0 auto;background:var(--st-ordered);color:#fff;border-radius:9px;padding:0 16px;font-weight:700;min-height:42px}
  .eta-inline .cancel{flex:0 0 auto;background:var(--surface-2);color:var(--muted);border-radius:9px;width:42px;min-height:42px;font-size:20px;line-height:1}
  .irow:last-child{border-bottom:none}
  .irow .iname{flex:1;min-width:0;font-weight:600;font-size:15.5px}
  .irow .iname .q{color:var(--amber-ink);font-family:var(--mono);font-weight:700;margin-left:6px;font-size:14px}
  .irow .iname .who{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-top:2px}
  .irow.s-arrived{opacity:.55}
  .rowbtn{flex:0 0 auto;border-radius:9px;padding:8px 13px;font-weight:700;font-size:13.5px;min-height:40px;border:1.5px solid transparent;white-space:nowrap}
  .rowbtn.order{background:var(--st-ordered);color:#fff}
  .rowbtn.arrive{background:var(--ink);color:#F3EEE6}
  .vfoot{display:flex;gap:8px;padding:10px 12px;background:var(--surface-2);border-top:1px solid var(--line-soft)}
  .batch{flex:1;border-radius:10px;padding:11px;font-weight:700;font-size:14px;min-height:46px;border:1.5px solid transparent}
  .batch.order{background:var(--st-ordered);color:#fff}
  .batch.arrive{background:var(--ink);color:#F3EEE6}
  .batch:disabled{opacity:.5}

  .banner{background:var(--st-pending-bg);border:1px solid #E9C4BD;color:#7A2A1C;
    border-radius:12px;padding:12px 14px;margin:0 0 12px;font-size:14px;line-height:1.5}
  .note{font-size:12.5px;color:var(--muted);margin:10px 2px 0;line-height:1.5}

  /* toast */
  .toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,30px);z-index:80;
    background:var(--ink);color:#F3EEE6;padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;
    box-shadow:0 8px 30px rgba(0,0,0,.3);opacity:0;visibility:hidden;transition:.25s;max-width:90vw;text-align:center}
  .toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}
  .toast.err{background:#7A2A1C}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  /* ---------- 管理頁 ---------- */
  .mseg{display:flex;gap:8px;margin:12px 0 6px}
  .mseg button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px;font-weight:700;color:var(--muted);min-height:42px}
  .mseg button.on{background:var(--ink);color:#F3EEE6;border-color:var(--ink)}
  .madd{display:block;width:100%;margin:8px 0 12px;border:1.5px solid var(--amber);color:var(--amber-ink);background:#fff;border-radius:12px;padding:13px;font-weight:700;min-height:48px}
  .mnote{font-size:12.5px;color:var(--muted);margin:2px 2px 12px;line-height:1.5}
  .mitem{display:flex;align-items:center;flex-wrap:wrap;gap:10px;background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:11px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
  .mitem.off{opacity:.62}
  .mitem .mmeta{flex:1 1 auto;min-width:130px}
  .mitem .mnm{font-weight:600;font-size:15.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .mitem .msub{font-size:12px;color:var(--muted);margin-top:3px}
  .offtag{font-size:10.5px;font-weight:800;color:var(--st-arrived);background:var(--st-arrived-bg);padding:2px 6px;border-radius:5px}
  .mgrtag{font-size:10.5px;font-weight:800;color:var(--st-ordered);background:var(--st-ordered-bg);padding:2px 6px;border-radius:5px}
  .mbtns{display:flex;gap:6px;flex:0 0 auto;justify-content:flex-end}
  .mbtn{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:9px;padding:8px 11px;font-weight:600;font-size:13px;min-height:38px;white-space:nowrap}
  .mbtn.del{color:var(--st-pending);border-color:#EAD3CE}
  .manual-form label.chk{display:flex;align-items:flex-start;gap:8px;font-weight:600;color:var(--ink);margin:6px 0 2px}
  .manual-form label.chk input{width:auto;margin:3px 0 0}

  /* ---------- 盤點 ---------- */
  .countnote{font-size:13px;color:var(--muted);line-height:1.6;margin:2px 2px 12px}
  .citem{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:11px 12px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer}
  .citem.on{border-color:var(--amber);background:#FBF3E6}
  .citem .meta{flex:1;min-width:0}
  .citem .nm{font-weight:600;font-size:16px;line-height:1.3;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .citem .sub{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .safetytag{font-size:11px;font-weight:800;color:var(--amber-ink);background:#FBEEDD;border:1px solid #F0D9BC;padding:2px 7px;border-radius:6px;white-space:nowrap}
  .incarttag{font-size:10.5px;font-weight:700;color:var(--st-ordered);background:var(--st-ordered-bg);padding:2px 6px;border-radius:5px;white-space:nowrap}
  .tick{flex:0 0 auto;width:30px;height:30px;border-radius:8px;border:2px solid var(--line);background:var(--surface-2);position:relative;transition:.12s}
  .citem.on .tick{background:var(--amber);border-color:var(--amber)}
  .citem.on .tick::after{content:"";position:absolute;left:9px;top:4px;width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
</style>
</head>
<body>

<header class="topbar">
  <div class="brandrow">
    <div class="brand">
      <span class="beam">白光</span>
      <small>進貨總台</small>
    </div>
    <label class="me-pick">我是
      <select id="mePick"></select>
    </label>
  </div>
  <div class="seg" id="branchSeg"></div>
</header>

<nav class="tabs">
  <button id="tabOrder" class="on">叫貨</button>
  <button id="tabCount">盤點</button>
  <button id="tabBoard">看板 <span class="count zero" id="boardCount">0</span></button>
  <button id="tabManage" style="display:none">管理</button>
</nav>

<!-- ============ 叫貨 ============ -->
<section id="viewOrder">
  <div class="searchbar">
    <div class="search-in">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search" type="search" placeholder="搜尋品項或廠商…" autocomplete="off">
      <button class="clr" id="clrSearch" style="display:none">×</button>
    </div>
  </div>
  <div class="wrap" id="catalog"></div>
</section>

<!-- ============ 盤點 ============ -->
<section id="viewCount" style="display:none">
  <div class="wrap">
    <p class="countnote">照安全量盤點：低於安全量（或快沒了）的品項打勾，最後一鍵加進叫貨清單，再到「叫貨」確認送出。</p>
    <div class="mseg" id="countSeg">
      <button id="cSegAll" class="on">全部品項</button>
      <button id="cSegSafety">只看有安全量</button>
    </div>
    <div id="countList"></div>
  </div>
</section>

<!-- ============ 看板 ============ -->
<section id="viewBoard" style="display:none">
  <div class="wrap" style="padding-top:0">
    <div class="filters" id="filters">
      <button class="fchip on" data-f="open">待處理</button>
      <button class="fchip" data-f="pending">待叫貨</button>
      <button class="fchip" data-f="ordered">已叫貨</button>
      <button class="fchip" data-f="arrived">已到貨</button>
    </div>
    <div class="board-tools">
      <span class="upd" id="lastUpd">—</span>
      <button class="refresh" id="refreshBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
        更新
      </button>
    </div>
    <div id="board"></div>
  </div>
</section>

<!-- ============ 管理（僅管理者） ============ -->
<section id="viewManage" style="display:none">
  <div class="wrap">
    <div class="mseg" id="mSeg">
      <button id="mSegItems" class="on">品項</button>
      <button id="mSegStaff">夥伴</button>
    </div>
    <div id="manageBody"></div>
  </div>
</section>

<!-- cart bar -->
<div class="cartbar" id="cartBar">
  <div class="inner">
    <div class="summary"><b id="cartCount">0</b> 項待送出</div>
    <button class="view" id="openCart">檢視並送出</button>
  </div>
</div>

<!-- count bar -->
<div class="cartbar" id="countBar" style="display:none">
  <div class="inner">
    <div class="summary">已勾 <b id="pickCount">0</b> 項</div>
    <button class="view" id="addPicks">加入叫貨清單</button>
  </div>
</div>

<!-- cart sheet -->
<div class="sheet-mask" id="sheetMask"></div>
<div class="sheet" id="cartSheet">
  <div class="grab"></div>
  <h2>叫貨清單 <button class="clear" id="clearCart">全部清除</button></h2>
  <div id="cartList"></div>
  <button class="submit" id="submitBtn">送出叫貨需求</button>
  <p class="note">送出後會同步到 Google 試算表的「<span id="sheetNameNote">叫貨系統</span>」分頁，看板即可看到。</p>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ====================================================================
     設定區（要改的東西都在這裡）
     ==================================================================== */

  // ★★ 部署後，把你 GAS 的網路應用程式網址貼這裡（結尾是 /exec）
  var GAS_URL = "https://script.google.com/macros/s/AKfycbyTdiWmjeVLIbUNxGguvwukHG17zYNhCaf1KmtFZ3VVUmTfebbmzXOy2jdNfzX2SOwKMw/exec";

  // 夥伴名單（決定「我是」下拉，以及誰能按「已叫貨」）
  // 夥伴名單改由 GAS 讀試算表「夥伴名單」提供（見 loadStaff）。「可管理」的夥伴才進得了管理頁。
  var staffList = [];          // [{name, manage}]
  var _mgr = {};               // name -> true（管理者）
  function isManager(name){ return !!_mgr[name]; }
  function applyStaff(list){
    staffList = list || [];
    _mgr = {};
    staffList.forEach(function(s){ if(s.manage) _mgr[s.name]=true; });
  }
  // 連不到後端時的最後退路（成成／菲比／顗蓁 為管理者）
  var FALLBACK_STAFF = [
    {name:"成成",manage:true},{name:"菲比",manage:true},{name:"顗蓁",manage:true},
    {name:"敏珊"},{name:"Evonne"},{name:"Ting"},{name:"Tina"},{name:"彥蓁"},{name:"睿睿"},{name:"63"},{name:"皮皮"}
  ];

  // ── 門市設定（新增/移除門市只要改這一個陣列）─────────────────────
  //   key   ＝ 送給 GAS 的 branch 值，也是 localStorage 記住的值
  //   label ＝ 上方切換鈕顯示的字
  //   sheet ＝ Google 試算表的分頁名稱（必須跟 GAS 端一模一樣）
  //   note  ＝ 叫貨頁最上方的提示（可省略）
  var BRANCHES = [
    { key:"白光本店",   label:"白光本店", sheet:"叫貨系統" },
    { key:"一隅",       label:"一隅",     sheet:"一隅叫貨系統" },
    { key:"新竹城隍店", label:"新竹城隍", sheet:"新竹城隍叫貨系統" }
  ];
  var DEFAULT_BRANCH = "白光本店";

  // 由 BRANCHES 自動產生，不用手動維護
  var SHEET_NAME = {};
  BRANCHES.forEach(function(b){ SHEET_NAME[b.key]=b.sheet; });
  function branchConf(key){
    for(var i=0;i<BRANCHES.length;i++){ if(BRANCHES[i].key===key) return BRANCHES[i]; }
    return null;
  }

  // 狀態值（需與 GAS／試算表一致，請勿改字）
  var ST = { PENDING:"未處理", ORDERED:"已處理/叫貨中", ARRIVED:"已到貨" };

  // 品項清單：改由 GAS 讀「品項主檔」分頁提供（欄位：門市／廠商／品項／單位／安全量／停用）。
  //   要新增品項、換廠商、調整安全量，直接改試算表就好，這支網頁不用動。見 loadCatalog()。
  var _cat = { items: [], groupsCache: {}, unitCache: {}, vendorCache: {}, safetyCache: {} };

  function relevantItems(branch){
    return _cat.items.filter(function(it){ return it.branch==="全部" || it.branch===branch; });
  }
  // 依門市把 _cat.items 整理成 [[廠商,[品項...]], ...]，並建立單位／廠商／安全量對照表
  function buildBranch(branch){
    var order=[], map={}, um={}, vm={}, sm={};
    relevantItems(branch).forEach(function(it){
      if(!map[it.vendor]){ map[it.vendor]=[]; order.push(it.vendor); }
      map[it.vendor].push(it.item);
      if(it.unit)   um[it.item]=it.unit;
      if(it.safety) sm[it.item]=it.safety;
      vm[it.item]=it.vendor;
    });
    _cat.groupsCache[branch]=order.map(function(v){ return [v, map[v]]; });
    _cat.unitCache[branch]=um; _cat.vendorCache[branch]=vm; _cat.safetyCache[branch]=sm;
  }
  function ensureBranch(branch){ if(!_cat.groupsCache[branch]) buildBranch(branch); }
  function clearCatalogCache(){ _cat.groupsCache={}; _cat.unitCache={}; _cat.vendorCache={}; _cat.safetyCache={}; }

  function unitOf(name){ ensureBranch(state.branch); return (_cat.unitCache[state.branch]||{})[name] || ""; }
  function safetyOf(name){ ensureBranch(state.branch); return (_cat.safetyCache[state.branch]||{})[name] || ""; }

  /* ====================================================================
     工具
     ==================================================================== */
  var $ = function(s,r){return (r||document).querySelector(s);};
  var $$ = function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){}}
  function groupsFor(branch){ ensureBranch(branch); return _cat.groupsCache[branch] || []; }
  // 用品項名反查廠商（看板依廠商分組用）；找不到歸「其他」
  function vendorOf(branch,item){ ensureBranch(branch); return (_cat.vendorCache[branch]||{})[item] || "其他"; }

  /* ---------- 從 GAS 讀取品項主檔（含快取，讀不到時沿用上次） ---------- */
  function loadCatalog(){
    return gas({action:"catalog"}).then(function(res){
      if(res && res.ok && res.items){
        _cat.items = res.items;
        clearCatalogCache();
        store("wlc_catalog", JSON.stringify(res.items));
        return true;
      }
      throw new Error(res && res.error || "讀取品項失敗");
    }).catch(function(e){
      var cached = store("wlc_catalog");
      if(cached){
        try{
          _cat.items = JSON.parse(cached);
          clearCatalogCache();
          toast("暫時讀不到最新品項，先用上次的清單", true);
          return false;
        }catch(_){ }
      }
      throw e;
    });
  }

  /* ---------- JSONP（GitHub Pages → GAS，免 CORS 設定） ---------- */
  function gas(params){
    return new Promise(function(resolve,reject){
      if(/請貼上/.test(GAS_URL)){ reject(new Error("尚未設定 GAS 網址")); return; }
      var cb="cb_"+Date.now()+"_"+Math.floor(Math.random()*1e6);
      var s=document.createElement("script");
      var done=false;
      var timer=setTimeout(function(){ if(done)return; cleanup(); reject(new Error("連線逾時")); },20000);
      function cleanup(){ done=true; clearTimeout(timer); try{delete window[cb];}catch(e){window[cb]=undefined;} if(s.parentNode)s.parentNode.removeChild(s); }
      window[cb]=function(data){ if(done)return; cleanup(); resolve(data); };
      params.callback=cb;
      var qs=Object.keys(params).map(function(k){return encodeURIComponent(k)+"="+encodeURIComponent(params[k]);}).join("&");
      s.src=GAS_URL+"?"+qs;
      s.onerror=function(){ if(done)return; cleanup(); reject(new Error("連線失敗")); };
      document.body.appendChild(s);
    });
  }

  /* ====================================================================
     狀態
     ==================================================================== */
  var state = {
    branch: branchConf(store("wlc_branch")) ? store("wlc_branch") : DEFAULT_BRANCH,
    me: store("wlc_me") || "",
    view: "order",
    cart: [],          // {key,n,v,p,qty}
    records: [],
    filter: "open"
  };

  /* ====================================================================
     初始化
     ==================================================================== */
  function initMe(){
    var sel=$("#mePick");
    sel.innerHTML='<option value="">選擇</option>'+staffList.map(function(s){return '<option'+(s.name===state.me?" selected":"")+'>'+esc(s.name)+'</option>';}).join("");
    sel.onchange=function(){ state.me=this.value; store("wlc_me",this.value); updateManageTab(); renderCatalog(); renderBoard(); };
    updateManageTab();
  }
  function initBranch(){
    var seg=$("#branchSeg");
    seg.className="seg"+(BRANCHES.length>=3?" n3":"");
    seg.innerHTML=BRANCHES.map(function(b){
      return '<button data-branch="'+esc(b.key)+'"'+(b.key===state.branch?' class="on"':'')+'>'+esc(b.label)+'</button>';
    }).join("");
    $$("#branchSeg button").forEach(function(b){
      b.addEventListener("click",function(){
        if(state.branch===b.dataset.branch) return;
        if(state.cart.length && !confirm("切換到「"+b.textContent+"」會清空目前的叫貨清單（"+state.cart.length+" 項），要繼續嗎？")) return;
        state.branch=b.dataset.branch; store("wlc_branch",state.branch);
        $$("#branchSeg button").forEach(function(x){x.classList.toggle("on",x===b);});
        $("#sheetNameNote").textContent=SHEET_NAME[state.branch];
        // 切店清空購物車與看板資料，避免送錯分頁／看到上一家店的殘影
        state.cart=[]; state.records=[]; countPick={};
        renderCart(); renderCatalog();
        if(state.view==="board") loadBoard();
        if(state.view==="count"){ renderCount(); updateCountBar(); }
      });
    });
    $("#sheetNameNote").textContent=SHEET_NAME[state.branch];
  }
  function initTabs(){
    $("#tabOrder").addEventListener("click",function(){ switchView("order"); });
    $("#tabCount").addEventListener("click",function(){ switchView("count"); });
    $("#tabBoard").addEventListener("click",function(){ switchView("board"); });
    $("#tabManage").addEventListener("click",function(){ switchView("manage"); });
  }
  function switchView(v){
    state.view=v;
    $("#tabOrder").classList.toggle("on",v==="order");
    $("#tabCount").classList.toggle("on",v==="count");
    $("#tabBoard").classList.toggle("on",v==="board");
    $("#tabManage").classList.toggle("on",v==="manage");
    $("#viewOrder").style.display=v==="order"?"":"none";
    $("#viewCount").style.display=v==="count"?"":"none";
    $("#viewBoard").style.display=v==="board"?"":"none";
    $("#viewManage").style.display=v==="manage"?"":"none";
    $("#cartBar").style.display=v==="order"?"":"none";
    $("#countBar").style.display=v==="count"?"":"none";
    if(v==="order") renderCatalog();
    if(v==="count") enterCount();
    if(v==="board") loadBoard();
    if(v==="manage") enterManage();
    window.scrollTo(0,0);
  }

  /* ====================================================================
     叫貨清單渲染
     ==================================================================== */
  var searchTerm="";
  function renderCatalog(){
    var box=$("#catalog");
    var groups = groupsFor(state.branch);
    var q=searchTerm.trim().toLowerCase();
    var html="";
    var conf=branchConf(state.branch);
    if(conf && conf.note) html+='<p class="note">'+esc(conf.note)+'</p>';
    var inCart={}; state.cart.forEach(function(c){inCart[c.key]=true;});
    var any=false;
    groups.forEach(function(g){
      var vendor=g[0];
      var items=g[1].filter(function(n){
        if(!q) return true;
        return n.toLowerCase().indexOf(q)>-1 || vendor.toLowerCase().indexOf(q)>-1;
      });
      if(!items.length) return;
      any=true;
      html+='<div class="vendor"><h3>'+esc(vendor)+'</h3><span class="rule"></span><span class="n">'+items.length+'</span></div>';
      items.forEach(function(n){
        var key=state.branch+"|"+vendor+"|"+n;
        var on=inCart[key];
        html+='<div class="item">'
          +'<div class="meta"><div class="nm">'+esc(n)+'</div>'+(unitOf(n)?'<div class="unit">單位：'+esc(unitOf(n))+'</div>':'')+'</div>'
          +'<button class="add'+(on?" in":"")+'" data-key="'+esc(key)+'" data-n="'+esc(n)+'" data-v="'+esc(vendor)+'">'+(on?"已加入":"加入")+'</button>'
          +'</div>';
      });
    });
    if(!any){
      html+='<div class="empty"><div class="big">找不到「'+esc(searchTerm)+'」</div>'
        +'<div>不在清單裡的品項，可以手動加入：</div>'
        +'<button class="add manual" id="manualOpen" style="display:inline-block;margin-top:14px;border:1.5px solid var(--amber);color:var(--amber-ink);background:#fff;border-radius:999px;padding:11px 20px;font-weight:700">手動加入品項</button>'
        +'</div>';
    } else {
      html+='<button class="add" id="manualOpen" style="display:block;width:100%;margin:18px 0;border:1.5px dashed var(--line);color:var(--muted);background:transparent;border-radius:12px;padding:14px;font-weight:600">＋ 清單裡沒有？手動加入品項</button>';
    }
    box.innerHTML=html;
    $$(".item .add",box).forEach(function(b){
      b.addEventListener("click",function(){ toggleItem(b.dataset); });
    });
    var mo=$("#manualOpen"); if(mo) mo.addEventListener("click",openManual);
  }

  function toggleItem(d){
    var idx=-1;
    for(var i=0;i<state.cart.length;i++){ if(state.cart[i].key===d.key){ idx=i; break; } }
    if(idx>-1) state.cart.splice(idx,1);
    else state.cart.push({key:d.key,n:d.n,v:d.v,qty:""});
    renderCatalog(); renderCart();
  }

  /* ---------- 手動加入（不在清單上的品項） ---------- */
  function openManual(){
    var html='<div class="manual-form">'
      +'<label>品項名稱</label><input id="mName" placeholder="例：手沖濾杯">'
      +'<div class="row2"><div><label>數量（可空白）</label><input id="mQty" placeholder="例：2 箱"></div>'
      +'<div><label>廠商（可空白）</label><input id="mVendor" placeholder="例：好市多"></div></div>'
      +'<button class="submit" id="mAdd" style="margin-top:4px">加入清單</button></div>';
    openSheetCustom("手動加入品項",html,function(){
      $("#mAdd").addEventListener("click",function(){
        var nm=$("#mName").value.trim();
        if(!nm){ toast("請先填品項名稱",true); return; }
        state.cart.push({key:"manual|"+Date.now(),n:nm,v:$("#mVendor").value.trim()||"手動",qty:$("#mQty").value.trim()});
        renderCatalog(); renderCart(); openCart();
      });
      setTimeout(function(){ $("#mName").focus(); },100);
    });
  }

  /* ====================================================================
     購物車
     ==================================================================== */
  function renderCart(){
    var n=state.cart.length;
    $("#cartCount").textContent=n;
    $("#cartBar").classList.toggle("show", n>0 && state.view==="order");
    var list=$("#cartList");
    if(!n){ list.innerHTML='<div class="empty" style="padding:30px"><div class="big">清單是空的</div><div>回去點「加入」挑要叫的貨。</div></div>'; $("#submitBtn").disabled=true; return; }
    $("#submitBtn").disabled=false;
    list.innerHTML=state.cart.map(function(c,i){
      return '<div class="crow">'
        +'<div class="nm">'+esc(c.n)+'<span class="v">'+esc(c.v)+'</span>'+(unitOf(c.n)?'<span class="u">單位：'+esc(unitOf(c.n))+'</span>':'')+'</div>'
        +'<div class="qty"><button data-i="'+i+'" data-d="-1">−</button>'
        +'<input data-i="'+i+'" value="'+esc(c.qty)+'" placeholder="數量" inputmode="text"></input>'
        +'<button data-i="'+i+'" data-d="1">＋</button></div>'
        +'<button class="del" data-del="'+i+'">×</button>'
        +'</div>';
    }).join("");
    $$('.qty button',list).forEach(function(b){
      b.addEventListener("click",function(){
        var i=+b.dataset.i, d=+b.dataset.d;
        var cur=parseInt(state.cart[i].qty,10); if(isNaN(cur)) cur=d>0?1:0;
        cur=Math.max(0,cur+d);
        state.cart[i].qty = cur===0?"":String(cur);
        renderCart();
      });
    });
    $$('.qty input',list).forEach(function(inp){
      inp.addEventListener("input",function(){ state.cart[+inp.dataset.i].qty=inp.value; });
    });
    $$('.del',list).forEach(function(b){
      b.addEventListener("click",function(){ state.cart.splice(+b.dataset.del,1); renderCart(); renderCatalog(); });
    });
  }

  /* ---------- bottom sheet ---------- */
  function openCart(){ $("#cartSheet").classList.add("open"); $("#sheetMask").classList.add("open"); }
  function closeSheet(){ $("#cartSheet").classList.remove("open"); $("#sheetMask").classList.remove("open"); restoreCartSheet(); }
  var _savedSheet=null;
  function openSheetCustom(title,html,after){
    var sheet=$("#cartSheet");
    if(!_savedSheet) _savedSheet=sheet.innerHTML;
    sheet.innerHTML='<div class="grab"></div><h2>'+esc(title)+'</h2>'+html;
    sheet.classList.add("open"); $("#sheetMask").classList.add("open");
    if(after) after();
  }
  function restoreCartSheet(){
    if(_savedSheet){ var sheet=$("#cartSheet"); sheet.innerHTML=_savedSheet; _savedSheet=null; bindCartSheet(); renderCart(); }
  }
  function bindCartSheet(){
    $("#clearCart").addEventListener("click",function(){ if(state.cart.length && confirm("清空整張叫貨清單？")){ state.cart=[]; renderCart(); renderCatalog(); } });
    $("#submitBtn").addEventListener("click",submitOrder);
  }

  /* ---------- 送出 ---------- */
  var submitting=false;
  function submitOrder(){
    if(submitting) return;
    if(!state.cart.length) return;
    if(!state.me){ toast("先在右上角選「我是」誰",true); return; }
    submitting=true;
    var btn=$("#submitBtn"); btn.disabled=true; var old=btn.textContent; btn.textContent="送出中…";
    var items=state.cart.map(function(c){return {item:c.n,qty:c.qty||"",vendor:c.v};});
    gas({action:"order",branch:state.branch,writer:state.me,payload:JSON.stringify(items)})
      .then(function(res){
        if(res&&res.ok){
          var n=state.cart.length;
          state.cart=[]; renderCart(); renderCatalog();
          toast("已送出 "+n+" 項叫貨需求");
          closeSheet();
          switchView("board");
        } else { throw new Error(res&&res.error||"未知錯誤"); }
      })
      .catch(function(e){ toast("送出失敗："+e.message,true); })
      .then(function(){ submitting=false; btn.disabled=false; btn.textContent=old; });
  }

  /* ====================================================================
     看板
     ==================================================================== */
  function statusKind(s){
    if(s===ST.ARRIVED) return "arrived";
    if(s===ST.ORDERED) return "ordered";
    return "pending"; // 未處理 或任何其他 → 待叫貨
  }
  var loadingBoard=false;
  function loadBoard(){
    if(loadingBoard) return;
    loadingBoard=true;
    var rb=$("#refreshBtn"); rb.classList.add("spin");
    if(!state.records.length) $("#board").innerHTML='<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
    gas({action:"list",branch:state.branch})
      .then(function(res){
        if(res&&res.ok){ state.records=res.records||[]; renderBoard(); $("#lastUpd").textContent="更新於 "+timeNow(); }
        else throw new Error(res&&res.error||"讀取失敗");
      })
      .catch(function(e){
        $("#board").innerHTML='<div class="empty"><div class="big">讀不到資料</div><div>'+esc(e.message)+'</div><button class="add manual" onclick="location.reload()" style="margin-top:14px;border:1.5px solid var(--amber);color:var(--amber-ink);background:#fff;border-radius:999px;padding:11px 20px;font-weight:700">重新整理</button></div>';
      })
      .then(function(){ loadingBoard=false; rb.classList.remove("spin"); });
  }
  function timeNow(){ var d=new Date(); return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2); }

  var boardGroups={}; // vendor → records（給批次用）
  function renderBoard(){
    var recs=state.records.map(function(r){
      return {time:r.time,item:r.item,qty:r.qty,writer:r.writer,status:r.status,eta:r.eta,
              vendor:vendorOf(state.branch,r.item), id:r.id||""};
    });
    // tab badge = 未到貨總數
    var openCnt=recs.filter(function(r){return statusKind(r.status)!=="arrived";}).length;
    var bc=$("#boardCount"); bc.textContent=openCnt; bc.classList.toggle("zero",openCnt===0);

    var f=state.filter;
    var filtered=recs.filter(function(r){
      var k=statusKind(r.status);
      if(f==="open")    return k!=="arrived";
      if(f==="arrived") return k==="arrived";
      return k===f; // pending / ordered
    });
    if(f==="arrived") filtered=filtered.slice(0,80); // 已到貨歷史只顯示最近 80 筆

    if(!filtered.length){
      boardGroups={};
      var msg = f==="arrived"?"還沒有已到貨的紀錄。"
              : "目前沒有待處理的叫貨。到「叫貨」頁新增需求。";
      $("#board").innerHTML='<div class="empty"><div class="big">沒有項目</div><div>'+esc(msg)+'</div></div>';
      return;
    }

    // 依廠商分組，保留出現順序（最新動到的廠商在上）
    var orderKeys=[], groups={};
    filtered.forEach(function(r){
      if(!groups[r.vendor]){ groups[r.vendor]=[]; orderKeys.push(r.vendor); }
      groups[r.vendor].push(r);
    });
    var rank={pending:0,ordered:1,arrived:2};
    boardGroups={};
    var html="";
    orderKeys.forEach(function(vendor){
      var arr=groups[vendor].slice().sort(function(a,b){ return rank[statusKind(a.status)]-rank[statusKind(b.status)]; });
      boardGroups[vendor]=arr;
      var c={pending:0,ordered:0,arrived:0}; arr.forEach(function(r){ c[statusKind(r.status)]++; });
      var cnt=[]; if(c.pending)cnt.push("待叫 "+c.pending); if(c.ordered)cnt.push("已叫 "+c.ordered); if(c.arrived)cnt.push("已到 "+c.arrived);

      html+='<div class="vcard"><div class="vhead"><h3>'+esc(vendor)+'</h3>'
        +'<span class="vcount">'+cnt.join("　")+'</span></div><div class="vbody">';
      arr.forEach(function(r){ html+=itemRow(r); });
      html+='</div>';

      var pend=arr.filter(function(r){return statusKind(r.status)==="pending";});
      var ord =arr.filter(function(r){return statusKind(r.status)==="ordered";});
      var foot="";
      if(pend.length>=2) foot+='<button class="batch order" data-batch="order" data-vendor="'+esc(vendor)+'">整組標記已叫貨 ('+pend.length+')</button>';
      if(ord.length>=2)  foot+='<button class="batch arrive" data-batch="arrive" data-vendor="'+esc(vendor)+'">整組標記已到貨 ('+ord.length+')</button>';
      if(foot) html+='<div class="vfoot">'+foot+'</div>';
      html+='</div>';
    });
    $("#board").innerHTML=html;
    bindBoard();
  }

  function itemRow(r){
    var k=statusKind(r.status);
    var tag = k==="pending"?'<span class="statetag pending">待叫貨</span>'
            : k==="ordered"?'<span class="statetag ordered">已叫貨</span>'
            : '<span class="statetag arrived">已到貨</span>';
    var sub="";
    if(r.writer) sub+='<span class="who">'+esc(r.writer)+' 登記</span>';
    if(k==="ordered" && r.eta) sub+='<span class="who">預計：'+esc(r.eta)+'</span>';
    var idAttr='data-item="'+esc(r.item)+'" data-id="'+esc(r.id)+'"';
    var btn="";
    if(k==="pending") btn='<button class="rowbtn order" data-do="order" '+idAttr+'>已叫貨</button>';
    else if(k==="ordered") btn='<button class="rowbtn arrive" data-do="arrive" '+idAttr+'>已到貨</button>';
    return '<div class="irow s-'+k+'">'
      +'<div class="iname">'+esc(r.item)+(r.qty?'<span class="q">'+esc(r.qty)+'</span>':"")+sub+'</div>'
      +tag+btn+'</div>';
  }

  function bindBoard(){
    $$('[data-do="order"]').forEach(function(b){
      b.addEventListener("click",function(){
        if(!state.me){ toast("先在右上角選「我是」誰",true); return; }
        openEtaInput(b);
      });
    });
    $$('[data-do="arrive"]').forEach(function(b){
      b.addEventListener("click",function(){
        if(!confirm("確認「"+b.dataset.item+"」已到貨？")) return;
        doUpdate(b.dataset.item,b.dataset.id,ST.ARRIVED,"",b);
      });
    });
    $$('[data-batch]').forEach(function(b){
      b.addEventListener("click",function(){ batchUpdate(b.dataset.vendor,b.dataset.batch,b); });
    });

  /* ---------- 標記已叫貨時，展開可留空的「預計到貨」輸入 ---------- */
  function openEtaInput(btn){
    var row=btn.closest(".irow");
    if(!row || row.querySelector(".eta-inline")) return; // 已展開就不重複
    var item=btn.dataset.item, id=btn.dataset.id;
    btn.style.display="none";
    var box=document.createElement("div");
    box.className="eta-inline";
    box.innerHTML='<input type="text" placeholder="預計到貨（可留空）" inputmode="text">'
      +'<button class="ok">已叫貨</button><button class="cancel" title="取消">×</button>';
    row.appendChild(box);
    var inp=box.querySelector("input"), ok=box.querySelector(".ok");
    try{ inp.focus(); }catch(e){}
    function close(){ box.remove(); btn.style.display=""; }
    ok.addEventListener("click",function(){ doUpdate(item,id,ST.ORDERED,inp.value.trim(),ok); });
    box.querySelector(".cancel").addEventListener("click",close);
    inp.addEventListener("keydown",function(e){ if(e.key==="Enter") ok.click(); });
  }

  /* ---------- 整組（批次）標記：依序送出，完成後刷新一次 ---------- */
  var batching=false;
  function batchUpdate(vendor,kind,btn){
    if(batching) return;
    var arr=boardGroups[vendor]||[];
    var fromKind=kind==="order"?"pending":"ordered";
    var targetStatus=kind==="order"?ST.ORDERED:ST.ARRIVED;
    var list=arr.filter(function(r){ return statusKind(r.status)===fromKind; });
    if(!list.length) return;
    if(kind==="order"){
      if(!state.me){ toast("先在右上角選「我是」誰",true); return; }
      if(!confirm(vendor+"：把 "+list.length+" 項都標記為已叫貨？")) return;
    } else {
      if(!confirm(vendor+"：把 "+list.length+" 項都標記為已到貨？")) return;
    }
    batching=true; btn.disabled=true; var old=btn.textContent; btn.textContent="處理中…";
    var pl=list.map(function(r){ return {id:r.id||"",item:r.item}; });
    gas({action:"batchUpdate",branch:state.branch,status:targetStatus,actor:state.me||"",payload:JSON.stringify(pl)})
      .then(function(res){
        if(res&&res.ok){ toast(vendor+" 整組完成："+(res.updated||0)+" 項"); loadBoard(); }
        else { throw new Error(res&&res.error||"失敗"); }
      })
      .catch(function(e){ toast("整組更新失敗："+e.message,true); btn.disabled=false; btn.textContent=old; })
      .then(function(){ batching=false; });
  }

  var updating=false;
  function doUpdate(item,id,status,eta,btn){
    if(updating) return; updating=true;
    var old=btn.textContent; btn.textContent="處理中…"; btn.disabled=true;
    gas({action:"update",branch:state.branch,item:item,id:id||"",status:status,eta:eta||"",actor:state.me||""})
      .then(function(res){
        if(res&&res.ok && res.updated){
          toast(status===ST.ARRIVED?"已標記到貨 ✓":"已標記叫貨 ✓");
          loadBoard();
        } else { throw new Error(res&&res.error||"找不到對應品項"); }
      })
      .catch(function(e){ toast("更新失敗："+e.message,true); btn.textContent=old; btn.disabled=false; })
      .then(function(){ updating=false; });
  }

  function loadStaff(){
    return gas({action:"staff"}).then(function(res){
      if(res && res.ok && res.staff && res.staff.length){ applyStaff(res.staff); store("wlc_staff", JSON.stringify(res.staff)); return true; }
      if(res && res.ok && res.staff && !res.staff.length){ applyStaff(FALLBACK_STAFF); return false; }  // 尚未 seedStaff → 用內建名單，避免鎖在外面
      throw new Error(res && res.error || "讀取夥伴名單失敗");
    }).catch(function(){
      var c=store("wlc_staff");
      if(c){ try{ applyStaff(JSON.parse(c)); return false; }catch(_){ } }
      applyStaff(FALLBACK_STAFF);
      return false;
    });
  }

  function findItem(id){ for(var i=0;i<manageItems.length;i++){ if(manageItems[i].id===id) return manageItems[i]; } return null; }
  function bindItemsPanel(){

  function vendorDatalist(){

    var vlist=vendorDatalist();

      +'<label>廠商</label><input id="fVendor" list="vendorList" value="'+esc(editing?it.vendor:"")+'" placeholder="例：好市多">'
      +'<datalist id="vendorList">'+vlist.map(function(v){return '<option value="'+esc(v)+'">';}).join("")+'</datalist>'
      +'<div class="row2"><div><label>單位（可空白）</label><input id="fUnit" value="'+esc(editing?it.unit:"")+'" placeholder="例：一箱6包"></div>'
      +'<div><label>安全量（可空白）</label><input id="fSafety" value="'+esc(editing?it.safety:"")+'" placeholder="例：2"></div></div>'
      +'<label>適用門市</label><select id="fBranch">'+branchOpts.map(function(k){return '<option'+(curBranch===k?" selected":"")+'>'+esc(k)+'</option>';}).join("")+'</select>'
      +'<button class="submit" id="fSave" style="margin-top:4px">'+(editing?"儲存變更":"加入品項")+'</button></div>';
    openSheetCustom(editing?"編輯品項":"新增品項",html,function(){

  /* ====================================================================
     盤點：照安全量打勾 → 一鍵加入叫貨
     ==================================================================== */
  var countPick = {};          // key -> {n, v}
  var countFilter = "all";     // all | safety

  function initCount(){
    $("#cSegAll").addEventListener("click",function(){ setCountFilter("all"); });
    $("#cSegSafety").addEventListener("click",function(){ setCountFilter("safety"); });
    $("#addPicks").addEventListener("click",addPicksToCart);
  }
  function setCountFilter(f){
    countFilter=f;
    $("#cSegAll").classList.toggle("on",f==="all");
    $("#cSegSafety").classList.toggle("on",f==="safety");
    renderCount();
  }
  function enterCount(){ renderCount(); updateCountBar(); }

  function renderCount(){
    var box=$("#countList");
    var groups=groupsFor(state.branch);
    var inCart={}; state.cart.forEach(function(c){ inCart[c.key]=true; });
    var html=""; var any=false;
    groups.forEach(function(g){
      var vendor=g[0];
      var items=g[1].filter(function(n){ return countFilter==="all" ? true : !!safetyOf(n); });
      if(!items.length) return;
      any=true;
      html+='<div class="vendor"><h3>'+esc(vendor)+'</h3><span class="rule"></span><span class="n">'+items.length+'</span></div>';
      items.forEach(function(n){
        var key=state.branch+"|"+vendor+"|"+n;
        var on=!!countPick[key];
        var sub=[];
        var sf=safetyOf(n);
        if(sf) sub.push('<span class="safetytag">安全量 '+esc(sf)+'</span>');
        if(unitOf(n)) sub.push('單位：'+esc(unitOf(n)));
        if(inCart[key]) sub.push('<span class="incarttag">已在叫貨清單</span>');
        html+='<div class="citem'+(on?" on":"")+'" data-key="'+esc(key)+'" data-n="'+esc(n)+'" data-v="'+esc(vendor)+'">'
          +'<div class="meta"><div class="nm">'+esc(n)+'</div>'
          +(sub.length?'<div class="sub">'+sub.join("　")+'</div>':'')+'</div>'
          +'<div class="tick" aria-hidden="true"></div>'
          +'</div>';
      });
    });
    if(!any){
      html='<div class="empty" style="padding:36px 10px"><div class="big">'
        +(countFilter==="safety"?"目前沒有設定安全量的品項":"這家店還沒有品項")+'</div>'
        +'<div>'+(countFilter==="safety"?"可以在「管理 → 品項」幫常盯庫存的品項填上安全量。":"到「管理 → 品項」新增，或先用叫貨的手動加入。")+'</div></div>';
    }
    box.innerHTML=html;
    $$("#countList .citem").forEach(function(row){
      row.addEventListener("click",function(){ toggleCountPick(row); });
    });
  }

  function toggleCountPick(row){
    var key=row.dataset.key;
    if(countPick[key]){ delete countPick[key]; row.classList.remove("on"); }
    else { countPick[key]={n:row.dataset.n, v:row.dataset.v}; row.classList.add("on"); }
    updateCountBar();
  }

  function countPickKeys(){ return Object.keys(countPick); }

  function updateCountBar(){
    var keys=countPickKeys();
    $("#pickCount").textContent=keys.length;
    $("#countBar").classList.toggle("show", keys.length>0 && state.view==="count");
  }

  function addPicksToCart(){
    var keys=countPickKeys();
    if(!keys.length) return;
    var inCart={}; state.cart.forEach(function(c){ inCart[c.key]=true; });
    var added=0;
    keys.forEach(function(key){
      if(inCart[key]) return;
      var p=countPick[key];
      state.cart.push({key:key, n:p.n, v:p.v, qty:""});
      added++;
    });
    countPick={};
    var dup=keys.length-added;
    switchView("order");
    renderCart();
    openCart();
    toast(added?("已加入 "+added+" 項到叫貨清單"+(dup?"（"+dup+" 項原本就在清單裡）":"")):"這些品項都已經在叫貨清單裡了");
  }

  function boot(){
    if(/請貼上/.test(GAS_URL)){
      var b=document.createElement("div"); b.className="banner"; b.style.margin="14px";
      b.innerHTML="⚙️ 還沒設定後端：請打開原始碼，把 <b>GAS_URL</b> 換成你 GAS 的部署網址（/exec 結尾），叫貨與看板才會連動。";
      document.body.insertBefore(b,document.querySelector("nav.tabs").nextSibling);
    }
    initBranch(); initTabs(); initSearch(); initFilters(); initSheet(); initManage(); initCount();
    $("#catalog").innerHTML='<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
    loadStaff().then(function(){ initMe(); });
    loadCatalog().then(function(){
      renderCatalog(); renderCart();
    }).catch(function(e){
      $("#catalog").innerHTML='<div class="empty"><div class="big">讀不到品項清單</div><div>'+esc(e.message)+'</div>'
        +'<button class="add manual" onclick="location.reload()" style="margin-top:14px;border:1.5px solid var(--amber);color:var(--amber-ink);background:#fff;border-radius:999px;padding:11px 20px;font-weight:700">重新整理</button></div>';
    });
    // 自動更新看板（在看板頁時每 45 秒）
    setInterval(function(){ if(state.view==="board" && !document.hidden) loadBoard(); },45000);
    document.addEventListener("visibilitychange",function(){ if(!document.hidden && state.view==="board") loadBoard(); });
  }
  boot();
})();
</script>

<!-- ============ 白光 自動更新（主力）：Service Worker，一律先連網路 ============ -->
<!-- 需要在這個 repo 根目錄放一支 sw.js（跟本頁同一層）。 -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
        .then(function (reg) {
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') reg.update();
          });
        })
        .catch(function () {});
    });
  }
</script>

<!-- ============ 白光 自動更新（備援）：比對版本 + whiteLightForceUpdate() ============ -->
<!-- 萬一某裝置沒跑 Service Worker，這段會用「不透過快取」抓最新原始碼， -->
<!-- 比對 <html data-build>，不一樣就自己重載最新版。 -->
<!-- 想放強制更新鈕就加：<button onclick="whiteLightForceUpdate()">強制更新</button> -->
<script>
(function () {
  var html  = document.documentElement;
  var BUILD = html.getAttribute('data-build') || '';
  var SELF  = location.pathname;

  var tag = document.getElementById('buildTag'); // 沒有這個元素也沒關係
  if (tag) tag.textContent = '版本 ' + (BUILD || '\u2014');

  function latestBuildFrom(text){
    var m = text.match(/<html[^>]*\sdata-build="([^"]*)"/i);
    return m ? m[1] : null;
  }
  function bust(url){
    return url + (url.indexOf('?') < 0 ? '?' : '&') + '_=' + Date.now();
  }
  function toast(msg){
    var t = document.createElement('div');
    t.textContent = msg;
    t.setAttribute('style',
      'position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);' +
      'transform:translateX(-50%);z-index:99999;background:#191A1C;color:#fff;' +
      'font:500 14px/1.4 -apple-system,system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;' +
      'padding:10px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.28);' +
      'opacity:0;transition:opacity .2s ease');
    document.body.appendChild(t);
    requestAnimationFrame(function(){ t.style.opacity = '1'; });
    return t;
  }
  function hardReload(tagStr){
    try { sessionStorage.setItem('wl_upd', String(Date.now())); } catch (e){}
    location.replace(SELF + '?v=' + encodeURIComponent(tagStr || Date.now()));
  }

  // 手動：清 Cache Storage 與 Service Worker 再重載（不會動到 localStorage 設定）
  window.whiteLightForceUpdate = function(){
    toast('更新中\u2026');
    var jobs = [];
    if (window.caches && caches.keys){
      jobs.push(caches.keys().then(function(keys){
        return Promise.all(keys.map(function(k){ return caches.delete(k); }));
      }));
    }
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
      jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){
        return Promise.all(rs.map(function(r){ return r.unregister(); }));
      }));
    }
    Promise.all(jobs).catch(function(){}).then(function(){
      hardReload('force-' + Date.now());
    });
  };

  function check(){
    if (!BUILD) return;
    if (!navigator.onLine) return;
    try {
      if (Date.now() - (+sessionStorage.getItem('wl_upd') || 0) < 6000) return;
    } catch (e){}
    fetch(bust(SELF), { cache: 'no-store' })
      .then(function(r){ return r.ok ? r.text() : null; })
      .then(function(text){
        if (!text) return;
        var latest = latestBuildFrom(text);
        if (latest && latest !== BUILD){
          toast('\u5df2\u6709\u65b0\u7248\u672c\uff0c\u66f4\u65b0\u4e2d\u2026');
          setTimeout(function(){ hardReload(latest); }, 400);
        }
      })
      .catch(function(){});
  }

  check();
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible') check();
  });
})();
</script>
<!-- ================== 白光 自動更新（結束）================== -->
